name: CI

# Builds and tests every pull request and every push to main on Ubuntu 26.04, Ubuntu 24.04 and
# Windows. The Linux app is packaged from 24.04, so it runs there and on everything newer
# (Linux Mint 22, Pop!_OS 24.04, Ubuntu 26.04); 26.04 checks the newer compiler. The apps can be
# downloaded for 14 days, and a tag like v0.1.0 publishes them as a GitHub release. macOS isn't
# built for now.
#
# Changes that only touch docs skip the build. The "CI result" job always runs and is the one
# check branch protection requires, so those changes can still be merged.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Anything outside docs/, Markdown files, LICENSE and .clang-format counts as code. Tags,
      # manual runs and new branches always build.
      - id: filter
        run: |
          base=""
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = push ] && [ "${{ github.ref_type }}" = branch ] &&
               [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] ||
             git diff --name-only "$base" HEAD | grep -qvE '^docs/|\.md$|^LICENSE$|^\.clang-format$'; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev

      # ccache makes rebuilds of the (unchanging) JUCE sources nearly free.
      - name: Cache ccache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Static MSVC runtime: the .exe runs without the Visual C++ redistributable installed.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Packed so the files keep their permissions (artifacts are zipped without them). Linux
      # ships the 24.04 build: it runs on 24.04 and newer.
      - name: Package
        if: matrix.os != 'ubuntu-26.04'
        shell: bash
        run: |
          mkdir -p package
          cd build/src/app/JuicyLoopsStudio_artefacts/Release
          case "${{ runner.os }}" in
            Linux) tar -czf "$GITHUB_WORKSPACE/package/juicy-loops-studio-linux-x64.tar.gz" \
                     "Juicy Loops Studio" ;;
            Windows) 7z a "$GITHUB_WORKSPACE/package/juicy-loops-studio-windows-x64.zip" \
                       "Juicy Loops Studio.exe" ;;
          esac

      - name: Upload app
        if: matrix.os != 'ubuntu-26.04'
        uses: actions/upload-artifact@v4
        with:
          name: juicy-loops-studio-${{ runner.os }}
          path: package/*
          retention-days: 14

  result:
    name: CI result
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check the build
        run: |
          echo "changes: ${{ needs.changes.result }}, build: ${{ needs.build.result }}"
          [ "${{ needs.changes.result }}" = success ] &&
            { [ "${{ needs.build.result }}" = success ] || [ "${{ needs.build.result }}" = skipped ]; }

  release:
    name: Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: package
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" package/* --repo "${{ github.repository }}" \
            --title "Juicy Loops Studio ${{ github.ref_name }}" --generate-notes
