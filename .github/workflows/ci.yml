name: CI

# Private repo with limited CI minutes (macOS bills 10x, Windows 2x):
# when on, pushes/PRs build on Linux only; other OSes run only when triggered manually
# (Actions tab -> CI -> Run workflow, or `gh workflow run ci.yml -f platforms=windows`).
# Windows and macOS runs upload the built app as an artifact to download.
#
# Automatic runs are off for now (maintainer's choice, 2026-10-18): build and test happen in the
# sandbox. To turn them back on, restore:
#   push: {branches: [main], paths-ignore: ['**.md', 'LICENSE', '.clang-format']}
#   pull_request: {paths-ignore: ['**.md', 'LICENSE', '.clang-format']}
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which OSes to build
        type: choice
        options: [all, windows, macos, linux]
        default: all

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: >-
          ${{ github.event_name != 'workflow_dispatch' && fromJSON('["ubuntu-latest"]')
          || inputs.platforms == 'windows' && fromJSON('["windows-latest"]')
          || inputs.platforms == 'macos' && fromJSON('["macos-latest"]')
          || inputs.platforms == 'linux' && fromJSON('["ubuntu-latest"]')
          || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev

      # ccache makes rebuilds of the (unchanging) JUCE sources nearly free.
      - name: Cache ccache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Static MSVC runtime: the .exe runs without the Visual C++ redistributable installed.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # Before the tests, so a test failure on a rarely built OS still leaves an app to try.
      - name: Upload app (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: juicy-loops-studio-windows
          path: build/src/app/JuicyLoopsStudio_artefacts/Release/*.exe
          retention-days: 14

      - name: Upload app (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: juicy-loops-studio-macos
          path: build/src/app/JuicyLoopsStudio_artefacts/Release/*.app
          retention-days: 14

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
